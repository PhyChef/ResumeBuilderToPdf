<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#1a1a2e;--gold:#c9a96e;--gold-light:#f5edd8;
  --bg:#f7f6f3;--white:#ffffff;--border:#e2e0d8;
  --text:#1a1a1a;--muted:#6b6b6b;--light:#f0ede6;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
nav{height:56px;background:var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.nav-logo{font-family:'DM Serif Display',serif;color:#fff;font-size:20px;font-weight:400;letter-spacing:-.01em}
.nav-logo span{color:var(--gold)}
.nav-right{display:flex;gap:6px}
.nav-btn{padding:7px 14px;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:all .15s;white-space:nowrap}
.nav-btn.grn{background:#27ae60;color:#fff}
.nav-btn.grn:hover{opacity:.88}
.nav-btn.pri{background:var(--gold);color:#fff}
.nav-btn.pri:hover{opacity:.88}
.app{display:grid;grid-template-columns:340px 1fr;align-items:start}
.form-panel{background:var(--white);border-right:1px solid var(--border)}
.form-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.form-header h2{font-size:14px;font-weight:600}
.tpl-row{display:flex;gap:5px}
.tpl-btn{padding:5px 10px;font-size:11px;font-weight:500;background:var(--bg);border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--muted);transition:all .15s;font-family:'DM Sans',sans-serif}
.tpl-btn.active,.tpl-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--light)}
.form-body{padding:18px 22px}
.fsec{margin-bottom:22px}
.fsec-title{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:3px;margin-top:9px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:#999;background:var(--white)}
textarea{resize:vertical;min-height:66px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add-btn{width:100%;margin-top:8px;padding:7px;font-size:12px;font-weight:500;background:none;border:1px dashed var(--border);border-radius:6px;cursor:pointer;color:var(--muted);transition:all .15s;font-family:'DM Sans',sans-serif}
.add-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-light)}
.entry-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:7px;position:relative}
.entry-card input,.entry-card textarea{background:var(--white)}
.rm-btn{position:absolute;top:7px;right:8px;background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1;transition:color .15s}
.rm-btn:hover{color:#c0392b}
.photo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.photo-preview{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);object-fit:cover;display:none;flex-shrink:0}
.photo-init{width:46px;height:46px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--accent);flex-shrink:0}
.upload-label{font-size:12px;padding:5px 11px;cursor:pointer;color:var(--muted);background:var(--light);border:1px solid var(--border);border-radius:6px;transition:all .15s;font-weight:500;display:inline-block}
.upload-label:hover{border-color:var(--gold);color:var(--gold)}
#photoInput{display:none}
.preview-panel{background:var(--bg);padding:28px 20px;display:flex;flex-direction:column;align-items:center}
.resume-paper{background:var(--white);width:100%;max-width:210mm;box-shadow:0 4px 40px rgba(0,0,0,.12);border-radius:3px;overflow:hidden}

/* CLASSIC */
.tpl-classic .rh{padding:32px 40px 22px;border-bottom:2px solid var(--accent);display:flex;align-items:flex-start;gap:16px}
.tpl-classic .rh-text{flex:1}
.tpl-classic .rh-photo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0}
.tpl-classic .rh-init{width:68px;height:68px;border-radius:50%;background:var(--light);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--accent);flex-shrink:0}
.tpl-classic .r-name{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;letter-spacing:-.02em;color:var(--accent)}
.tpl-classic .r-role{font-size:12px;color:var(--muted);margin-top:3px}
.tpl-classic .r-contacts{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;font-size:10px;color:var(--muted)}
.tpl-classic .rb{padding:22px 40px;display:grid;grid-template-columns:1fr 190px;gap:28px}
.tpl-classic .r-sec{margin-bottom:18px}
.tpl-classic .r-sec-title{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px;padding-bottom:4px;border-bottom:1.5px solid var(--accent)}
.tpl-classic .r-entry{margin-bottom:10px}
.tpl-classic .r-et{display:flex;justify-content:space-between;align-items:baseline}
.tpl-classic .r-org{font-weight:600;font-size:11px}
.tpl-classic .r-date{font-size:10px;color:var(--muted);white-space:nowrap}
.tpl-classic .r-pos{font-size:10px;color:var(--muted);margin:1px 0 2px}
.tpl-classic .r-desc{font-size:10px;line-height:1.55;color:#333}
.tpl-classic .r-summary{font-size:10px;line-height:1.65;color:#333}
.tpl-classic .aside-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;margin-top:14px}
.tpl-classic .aside-title:first-child{margin-top:0}
.tpl-classic .aside-val{font-size:10px;color:#333;line-height:1.5;margin-bottom:1px}
.tpl-classic .r-skill{display:inline-block;font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:20px;margin:2px 2px 2px 0;color:var(--muted)}

/* MODERN */
.tpl-modern .rh{background:var(--accent);padding:30px 36px;display:flex;align-items:center;gap:18px}
.tpl-modern .rh-photo{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.tpl-modern .rh-init{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;flex-shrink:0}
.tpl-modern .r-name{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;color:#fff}
.tpl-modern .r-role{font-size:10px;color:var(--gold);margin-top:3px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.tpl-modern .r-contacts{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;font-size:10px;color:rgba(255,255,255,.6)}
.tpl-modern .rb{display:grid;grid-template-columns:180px 1fr}
.tpl-modern .r-aside{background:var(--light);padding:20px 16px;border-right:1px solid var(--border)}
.tpl-modern .r-main{padding:20px 26px}
.tpl-modern .r-sec{margin-bottom:18px}
.tpl-modern .r-sec-title{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.tpl-modern .r-entry{margin-bottom:10px;padding-left:9px;border-left:2px solid var(--border)}
.tpl-modern .r-et{display:flex;justify-content:space-between;align-items:baseline}
.tpl-modern .r-org{font-weight:600;font-size:11px}
.tpl-modern .r-date{font-size:10px;color:var(--muted);white-space:nowrap}
.tpl-modern .r-pos{font-size:10px;color:var(--muted);margin:1px 0 2px}
.tpl-modern .r-desc{font-size:10px;line-height:1.55;color:#333}
.tpl-modern .r-summary{font-size:10px;line-height:1.65;color:#333}
.tpl-modern .aside-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;margin-top:14px}
.tpl-modern .aside-title:first-child{margin-top:0}
.tpl-modern .aside-val{font-size:10px;color:#333;line-height:1.5;margin-bottom:1px}
.tpl-modern .r-skill{display:block;font-size:10px;padding:3px 7px;border-radius:4px;margin-bottom:3px;background:var(--white);border:1px solid var(--border);color:#333}

/* MINIMAL */
.tpl-minimal .rh{padding:40px 48px 18px}
.tpl-minimal .rh-inner{display:flex;align-items:flex-start;gap:14px}
.tpl-minimal .rh-photo{width:76px;height:76px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.tpl-minimal .rh-init{width:76px;height:76px;border-radius:8px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:var(--muted);flex-shrink:0}
.tpl-minimal .r-name{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;letter-spacing:-.03em;color:var(--text)}
.tpl-minimal .r-role{font-size:12px;color:var(--gold);margin-top:4px;font-weight:500}
.tpl-minimal .r-contacts{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:10px;color:var(--muted);padding-top:10px;border-top:1px solid var(--border)}
.tpl-minimal .rb{padding:20px 48px;display:grid;grid-template-columns:1fr 160px;gap:32px}
.tpl-minimal .r-sec{margin-bottom:20px}
.tpl-minimal .r-sec-title{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.tpl-minimal .r-entry{margin-bottom:12px}
.tpl-minimal .r-et{display:flex;justify-content:space-between;align-items:baseline}
.tpl-minimal .r-org{font-weight:600;font-size:12px}
.tpl-minimal .r-date{font-size:10px;color:var(--muted);white-space:nowrap}
.tpl-minimal .r-pos{font-size:10px;color:var(--gold);margin:2px 0 3px;font-weight:500}
.tpl-minimal .r-desc{font-size:10px;line-height:1.6;color:#444}
.tpl-minimal .r-summary{font-size:10px;line-height:1.7;color:#444;font-style:italic}
.tpl-minimal .aside-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;margin-top:14px}
.tpl-minimal .aside-title:first-child{margin-top:0}
.tpl-minimal .aside-val{font-size:10px;color:#444;line-height:1.5;margin-bottom:2px}
.tpl-minimal .r-skill{font-size:10px;color:#444;margin-bottom:4px;padding-left:9px;border-left:2px solid var(--gold);display:block}

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,46,.75);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.active{display:flex}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{color:#fff;font-size:14px;font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.app{grid-template-columns:1fr}.resume-paper{max-width:100%}.nav-btn{padding:6px 9px;font-size:11px}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Generating...</div>
</div>

<nav>
  <div class="nav-logo">Resume<span>Builder</span></div>
  <div class="nav-right">
    <button class="nav-btn grn" onclick="downloadImage()">⬇ Save as Image</button>
    <button class="nav-btn pri" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</nav>

<div class="app">
  <div class="form-panel">
    <div class="form-header">
      <h2>Your details</h2>
      <div class="tpl-row">
        <button class="tpl-btn active" onclick="setTpl('classic',this)">Classic</button>
        <button class="tpl-btn" onclick="setTpl('modern',this)">Modern</button>
        <button class="tpl-btn" onclick="setTpl('minimal',this)">Minimal</button>
      </div>
    </div>
    <div class="form-body" id="formBody">
      <div class="fsec">
        <div class="fsec-title">Personal info</div>
        <div class="photo-row">
          <div class="photo-init" id="sideInit">?</div>
          <img class="photo-preview" id="sidePhoto" alt="photo">
          <div>
            <label class="upload-label" for="photoInput">Upload photo</label>
            <input type="file" id="photoInput" accept="image/*">
            <div id="photoName" style="font-size:10px;color:#bbb;margin-top:3px">No file</div>
          </div>
        </div>
        <label>Full name</label>
        <input id="fullName" placeholder="e.g. John Smith" oninput="render()">
        <label>Job title</label>
        <input id="jobTitle" placeholder="e.g. Marketing Manager" oninput="render()">
        <div class="row2">
          <div><label>Email</label><input id="email" placeholder="you@email.com" oninput="render()"></div>
          <div><label>Phone</label><input id="phone" placeholder="+1 234 567 890" oninput="render()"></div>
        </div>
        <div class="row2">
          <div><label>Location</label><input id="location" placeholder="City, Country" oninput="render()"></div>
          <div><label>LinkedIn / web</label><input id="linkedin" placeholder="linkedin.com/in/..." oninput="render()"></div>
        </div>
        <label>Profile summary</label>
        <textarea id="summary" placeholder="e.g. Results-driven professional with 10+ years experience in operations and team leadership." oninput="render()"></textarea>
      </div>
      <div class="fsec">
        <div class="fsec-title">Experience</div>
        <div id="expBlocks"></div>
        <button class="add-btn" onclick="addExp()">+ Add position</button>
      </div>
      <div class="fsec">
        <div class="fsec-title">Education</div>
        <div id="eduBlocks"></div>
        <button class="add-btn" onclick="addEdu()">+ Add education</button>
      </div>
      <div class="fsec">
        <div class="fsec-title">Skills, languages & certifications</div>
        <label>Skills (comma separated)</label>
        <input id="skills" placeholder="e.g. Project management, Excel, Public speaking" oninput="render()">
        <label>Languages (comma separated)</label>
        <input id="langs" placeholder="e.g. English (native), Spanish (fluent)" oninput="render()">
        <label>Certifications / awards (one per line)</label>
        <textarea id="certs" rows="3" placeholder="e.g. PMP Certification&#10;Employee of the Year 2022" oninput="render()"></textarea>
      </div>
    </div>
  </div>

  <div class="preview-panel">
    <div class="resume-paper tpl-classic" id="resumePaper"></div>
  </div>
</div>

<script>
let photoData=null,tpl='classic',expData=[],eduData=[],expCount=0,eduCount=0;

function v(id){return(document.getElementById(id)||{}).value||'';}
function ini(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';}

document.getElementById('photoInput').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;
  document.getElementById('photoName').textContent=f.name;
  const r=new FileReader();
  r.onload=ev=>{
    photoData=ev.target.result;
    document.getElementById('sideInit').style.display='none';
    const sp=document.getElementById('sidePhoto');sp.style.display='block';sp.src=photoData;
    render();
  };
  r.readAsDataURL(f);
});
window.addEventListener('beforeunload',()=>{photoData=null;});

function photoEl(pc,ic){
  if(photoData)return`<img src="${photoData}" class="${pc}" alt="photo">`;
  const n=v('fullName');return n?`<div class="${ic}">${ini(n)}</div>`:'';
}
function entries(arr){
  return arr.filter(e=>e.org||e.role).map(e=>`
    <div class="r-entry">
      <div class="r-et"><span class="r-org">${e.org||''}</span><span class="r-date">${[e.start,e.end].filter(Boolean).join(' – ')}</span></div>
      ${e.role?`<div class="r-pos">${e.role}</div>`:''}
      ${e.desc?`<div class="r-desc">${e.desc.replace(/\n/g,'<br>')}</div>`:''}
    </div>`).join('');
}
function eduEntries(arr){
  return arr.filter(e=>e.org||e.role).map(e=>`
    <div class="r-entry">
      <div class="r-et"><span class="r-org">${e.org||''}</span><span class="r-date">${[e.start,e.end].filter(Boolean).join(' – ')}</span></div>
      ${e.role?`<div class="r-pos">${e.role}</div>`:''}
    </div>`).join('');
}
function aside(){
  const sk=v('skills').split(',').map(s=>s.trim()).filter(Boolean);
  const la=v('langs').split(',').map(s=>s.trim()).filter(Boolean);
  const ce=v('certs').split('\n').map(s=>s.trim()).filter(Boolean);
  let h='';
  if(sk.length){h+=`<div class="aside-title">Skills</div>`;h+=tpl==='modern'?sk.map(s=>`<div class="r-skill">${s}</div>`).join(''):sk.map(s=>`<span class="r-skill">${s}</span>`).join('');}
  if(la.length)h+=`<div class="aside-title">Languages</div>`+la.map(s=>`<div class="aside-val">${s}</div>`).join('');
  if(ce.length)h+=`<div class="aside-title">Certifications</div>`+ce.map(s=>`<div class="aside-val">${s}</div>`).join('');
  return h;
}
function ct(){return[v('email'),v('phone'),v('location'),v('linkedin')].filter(Boolean).map(c=>`<span>${c}</span>`).join('');}

function renderClassic(){
  const exp=entries(expData),edu=eduEntries(eduData),c=ct();
  return`<div class="rh"><div class="rh-text"><div class="r-name">${v('fullName')||'Your Name'}</div>${v('jobTitle')?`<div class="r-role">${v('jobTitle')}</div>`:''} ${c?`<div class="r-contacts">${c}</div>`:''}</div>${photoEl('rh-photo','rh-init')}</div>
  <div class="rb"><div class="r-main">
  ${v('summary')?`<div class="r-sec"><div class="r-sec-title">Profile</div><div class="r-summary">${v('summary').replace(/\n/g,'<br>')}</div></div>`:''}
  ${exp?`<div class="r-sec"><div class="r-sec-title">Experience</div>${exp}</div>`:''}
  ${edu?`<div class="r-sec"><div class="r-sec-title">Education</div>${edu}</div>`:''}
  </div><div class="r-aside">${aside()}</div></div>`;
}
function renderModern(){
  const exp=entries(expData),edu=eduEntries(eduData),c=ct();
  return`<div class="rh">${photoEl('rh-photo','rh-init')}<div><div class="r-name">${v('fullName')||'Your Name'}</div>${v('jobTitle')?`<div class="r-role">${v('jobTitle')}</div>`:''} ${c?`<div class="r-contacts">${c}</div>`:''}</div></div>
  <div class="rb"><div class="r-aside">${aside()}</div><div class="r-main">
  ${v('summary')?`<div class="r-sec"><div class="r-sec-title">Profile</div><div class="r-summary">${v('summary').replace(/\n/g,'<br>')}</div></div>`:''}
  ${exp?`<div class="r-sec"><div class="r-sec-title">Experience</div>${exp}</div>`:''}
  ${edu?`<div class="r-sec"><div class="r-sec-title">Education</div>${edu}</div>`:''}
  </div></div>`;
}
function renderMinimal(){
  const exp=entries(expData),edu=eduEntries(eduData),c=ct();
  return`<div class="rh"><div class="rh-inner">${photoEl('rh-photo','rh-init')}<div><div class="r-name">${v('fullName')||'Your Name'}</div>${v('jobTitle')?`<div class="r-role">${v('jobTitle')}</div>`:''}</div></div>${c?`<div class="r-contacts">${c}</div>`:''}</div>
  <div class="rb"><div class="r-main">
  ${v('summary')?`<div class="r-sec"><div class="r-sec-title">Profile</div><div class="r-summary">${v('summary').replace(/\n/g,'<br>')}</div></div>`:''}
  ${exp?`<div class="r-sec"><div class="r-sec-title">Experience</div>${exp}</div>`:''}
  ${edu?`<div class="r-sec"><div class="r-sec-title">Education</div>${edu}</div>`:''}
  </div><div class="r-aside">${aside()}</div></div>`;
}

function render(){
  const p=document.getElementById('resumePaper');
  p.className='resume-paper tpl-'+tpl;
  if(tpl==='classic')p.innerHTML=renderClassic();
  else if(tpl==='modern')p.innerHTML=renderModern();
  else p.innerHTML=renderMinimal();
  const n=v('fullName'),si=document.getElementById('sideInit');
  if(si&&!photoData)si.textContent=n?ini(n):'?';
}

function setTpl(t,btn){tpl=t;document.querySelectorAll('.tpl-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function addExp(){
  const id='e'+(++expCount);expData.push({id,org:'',role:'',start:'',end:'',desc:''});
  const d=document.createElement('div');d.className='entry-card';d.id='blk-'+id;
  d.innerHTML=`<button class="rm-btn" onclick="rmExp('${id}')">×</button>
    <label>Company / hotel</label><input placeholder="e.g. Acme Corporation" oninput="upExp('${id}','org',this.value)">
    <label>Role / title</label><input placeholder="e.g. Senior Manager" oninput="upExp('${id}','role',this.value)">
    <div class="row2"><div><label>From</label><input placeholder="Jan 2020" oninput="upExp('${id}','start',this.value)"></div><div><label>To</label><input placeholder="Present" oninput="upExp('${id}','end',this.value)"></div></div>
    <label>Key achievements</label><textarea placeholder="e.g. Managed team of 15, reduced costs by 20%, launched new product line." oninput="upExp('${id}','desc',this.value)"></textarea>`;
  document.getElementById('expBlocks').appendChild(d);render();
}
function upExp(id,k,val){const e=expData.find(x=>x.id===id);if(e){e[k]=val;render();}}
function rmExp(id){expData=expData.filter(e=>e.id!==id);const el=document.getElementById('blk-'+id);if(el)el.remove();render();}

function addEdu(){
  const id='u'+(++eduCount);eduData.push({id,org:'',role:'',start:'',end:''});
  const d=document.createElement('div');d.className='entry-card';d.id='blk-'+id;
  d.innerHTML=`<button class="rm-btn" onclick="rmEdu('${id}')">×</button>
    <label>Institution</label><input placeholder="e.g. University of London" oninput="upEdu('${id}','org',this.value)">
    <label>Degree / qualification</label><input placeholder="e.g. BSc Business Administration" oninput="upEdu('${id}','role',this.value)">
    <div class="row2"><div><label>From</label><input placeholder="2006" oninput="upEdu('${id}','start',this.value)"></div><div><label>To</label><input placeholder="2008" oninput="upEdu('${id}','end',this.value)"></div></div>`;
  document.getElementById('eduBlocks').appendChild(d);render();
}
function upEdu(id,k,val){const e=eduData.find(x=>x.id===id);if(e){e[k]=val;render();}}
function rmEdu(id){eduData=eduData.filter(e=>e.id!==id);const el=document.getElementById('blk-'+id);if(el)el.remove();render();}

function showLoading(text){document.getElementById('loadingText').textContent=text;document.getElementById('loadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('active');}

function captureCanvas(callback){
  html2canvas(document.getElementById('resumePaper'),{
    scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff',
    allowTaint:true
  }).then(callback).catch(()=>hideLoading());
}

function downloadPDF(){
  const name=(v('fullName')||'resume').replace(/\s+/g,'-').toLowerCase();
  showLoading('Generating PDF...');
  setTimeout(()=>{
    captureCanvas(canvas=>{
      const imgData=canvas.toDataURL('image/jpeg',0.98);
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      const w=210,h=(canvas.height*210)/canvas.width;
      pdf.addImage(imgData,'JPEG',0,0,w,h);
      pdf.save(name+'-resume.pdf');
      hideLoading();
    });
  },100);
}

function downloadImage(){
  const name=(v('fullName')||'resume').replace(/\s+/g,'-').toLowerCase();
  showLoading('Generating image...');
  setTimeout(()=>{
    captureCanvas(canvas=>{
      canvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=name+'-resume.png';a.click();
        setTimeout(()=>URL.revokeObjectURL(url),100);
        hideLoading();
      },'image/png');
    });
  },100);
}

addExp();addEdu();render();
</script>
</body>
</html>
